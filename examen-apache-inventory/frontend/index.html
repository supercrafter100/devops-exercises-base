<!doctype html>
<html lang="nl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Northwind Hardware — Magazijnbeheer</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-stone-100 min-h-screen">
        <div class="max-w-5xl mx-auto px-4 py-10">
            <header class="mb-8 flex items-end justify-between flex-wrap gap-4">
                <div>
                    <p
                        class="text-xs font-semibold tracking-widest text-amber-700 uppercase"
                    >
                        Northwind Hardware NV
                    </p>
                    <h1 class="text-3xl font-bold text-stone-800">
                        Magazijnbeheer
                    </h1>
                    <p class="text-stone-600 mt-1 text-sm">
                        Voorraad per artikelnummer en magazijnlocatie.
                    </p>
                </div>
                <div
                    id="storageBadge"
                    class="text-xs font-mono px-3 py-1.5 rounded-full bg-stone-200 text-stone-700"
                >
                    opslag: onbekend
                </div>
            </header>

            <!-- Nieuw onderdeel toevoegen -->
            <section
                class="bg-white rounded-xl shadow-sm border border-stone-200 p-5 mb-6"
            >
                <h2 class="text-sm font-semibold text-stone-700 mb-3">
                    Onderdeel toevoegen
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
                    <input
                        id="sku"
                        placeholder="Artikelnr. (NH-1234)"
                        class="rounded-lg border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                    />
                    <input
                        id="name"
                        placeholder="Omschrijving"
                        class="sm:col-span-2 rounded-lg border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                    />
                    <input
                        id="location"
                        placeholder="Locatie (A-01-3)"
                        class="rounded-lg border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                    />
                    <input
                        id="quantity"
                        type="number"
                        min="0"
                        value="0"
                        placeholder="Aantal"
                        class="rounded-lg border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                    />
                </div>
                <button
                    id="addBtn"
                    class="mt-3 rounded-lg bg-amber-600 text-white px-4 py-2 text-sm font-medium hover:bg-amber-700 active:bg-amber-800 transition-colors"
                >
                    Toevoegen
                </button>
                <p id="errorMsg" class="hidden mt-3 text-sm text-red-600"></p>
            </section>

            <!-- Voorraadlijst -->
            <section
                class="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden"
            >
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-stone-50 text-stone-600">
                            <tr>
                                <th class="text-left font-semibold px-4 py-3">
                                    Artikelnr.
                                </th>
                                <th class="text-left font-semibold px-4 py-3">
                                    Omschrijving
                                </th>
                                <th class="text-left font-semibold px-4 py-3">
                                    Locatie
                                </th>
                                <th class="text-right font-semibold px-4 py-3">
                                    Aantal
                                </th>
                                <th class="px-4 py-3"></th>
                            </tr>
                        </thead>
                        <tbody
                            id="partsBody"
                            class="divide-y divide-stone-100"
                        ></tbody>
                    </table>
                </div>
                <p
                    id="emptyMsg"
                    class="hidden px-4 py-8 text-center text-sm text-stone-500"
                >
                    Nog geen onderdelen in het magazijn.
                </p>
            </section>

            <footer class="text-center mt-8 text-xs text-stone-500">
                API verwacht op <span class="font-mono">/api</span> op dezelfde
                origin.
            </footer>
        </div>

        <script src="./script.js"></script>
    </body>
</html>
