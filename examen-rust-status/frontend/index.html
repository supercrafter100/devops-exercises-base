<!doctype html>
<html lang="nl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Meridian Freight — Statusbord</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-zinc-950 min-h-screen text-zinc-100">
        <div class="max-w-4xl mx-auto px-4 py-10">
            <header class="mb-8 flex items-end justify-between flex-wrap gap-4">
                <div>
                    <p
                        class="text-xs font-semibold tracking-widest text-cyan-400 uppercase"
                    >
                        Meridian Freight
                    </p>
                    <h1 class="text-3xl font-bold">Statusbord zendingen</h1>
                    <p class="text-zinc-400 mt-1 text-sm">
                        Overzicht van alle actieve zendingen.
                    </p>
                </div>
                <div
                    id="storageBadge"
                    class="text-xs font-mono px-3 py-1.5 rounded-full bg-zinc-800 text-zinc-300"
                >
                    opslag: onbekend
                </div>
            </header>

            <!-- Zending toevoegen -->
            <section
                class="bg-zinc-900 rounded-xl border border-zinc-800 p-5 mb-6"
            >
                <h2 class="text-sm font-semibold text-zinc-200 mb-3">
                    Zending registreren
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input
                        id="tracking"
                        placeholder="Trackingnummer (MF-00000)"
                        class="rounded-lg bg-zinc-950 border border-zinc-800 px-3 py-2 text-sm placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                    />
                    <input
                        id="destination"
                        placeholder="Bestemming"
                        class="rounded-lg bg-zinc-950 border border-zinc-800 px-3 py-2 text-sm placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                    />
                    <select
                        id="status"
                        class="rounded-lg bg-zinc-950 border border-zinc-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"
                    >
                        <option value="onderweg">Onderweg</option>
                        <option value="vertraagd">Vertraagd</option>
                        <option value="geleverd">Geleverd</option>
                    </select>
                </div>
                <button
                    id="addBtn"
                    class="mt-3 rounded-lg bg-cyan-600 text-white px-4 py-2 text-sm font-medium hover:bg-cyan-700 transition-colors"
                >
                    Registreren
                </button>
                <p id="errorMsg" class="hidden mt-3 text-sm text-red-400"></p>
            </section>

            <!-- Statusbord -->
            <section
                class="bg-zinc-900 rounded-xl border border-zinc-800 overflow-hidden"
            >
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-zinc-950/60 text-zinc-500">
                            <tr>
                                <th class="text-left font-semibold px-4 py-3">
                                    Tracking
                                </th>
                                <th class="text-left font-semibold px-4 py-3">
                                    Bestemming
                                </th>
                                <th class="text-left font-semibold px-4 py-3">
                                    Status
                                </th>
                                <th class="px-4 py-3"></th>
                            </tr>
                        </thead>
                        <tbody
                            id="shipmentsBody"
                            class="divide-y divide-zinc-800"
                        ></tbody>
                    </table>
                </div>
                <p
                    id="emptyMsg"
                    class="hidden px-4 py-8 text-center text-sm text-zinc-600"
                >
                    Nog geen zendingen geregistreerd.
                </p>
            </section>

            <footer class="text-center mt-8 text-xs text-zinc-600">
                API verwacht op <span class="font-mono">/api</span> op dezelfde
                origin.
            </footer>
        </div>

        <script src="./script.js"></script>
    </body>
</html>
